[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "cryptography>=50.0.2",
    "fastapi[standard]>=0.141.1",
    "fastmcp>=4.1.0",
    "httpx>=0.28.1",
    "langchain[mcp]>=1.4.5",
    "langgraph>=1.2.15",
    "pyjwt>=2.13.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "structlog>=26.1.0",
]

[tool.fastapi]
entrypoint = "app.main:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
